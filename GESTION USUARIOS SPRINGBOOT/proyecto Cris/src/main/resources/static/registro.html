<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Fintech Style</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>

    <div class="auth-container">
        <h2>Crear Cuenta</h2>
        <p class="subtitle">Únete a la nueva era digital.</p>
        
        <div id="alert" class="alert"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Ej. Cristian Orrego" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="tu@correo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
            </div>

            <button type="submit" id="submitBtn">Comenzar ahora</button>
        </form>

        <div class="links">
            ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
        </div>
    </div>

    <script src="api.js"></script>
    
    <script>
        const form = document.getElementById('registerForm');
        const alertEl = document.getElementById('alert');
        const submitBtn = document.getElementById('submitBtn');

        function show(msg, type = 'error') {
            alertEl.textContent = msg;
            alertEl.className = `alert alert-${type} show`;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertEl.className = 'alert';
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Registrando...';

            try {
                await api.registro(
                    document.getElementById('nombre').value.trim(),
                    document.getElementById('correo').value.trim(),
                    document.getElementById('password').value
                );
                show('¡Cuenta creada! Redirigiendo al login...', 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 1400);
            } catch (err) {
                show(err.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Comenzar ahora';
            }
        });
    </script>
</body>
</html>
